apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout-svc, namespace: prod}
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: checkout-svc
          image: registry.internal/checkout-svc:4.12.0
          ports: [{containerPort: 8080}]
          resources:
            limits: {memory: 512Mi, cpu: "1"}
            requests: {memory: 256Mi, cpu: "250m"}
          livenessProbe: {httpGet: {path: /api/checkout/health, port: 8080}, periodSeconds: 30}
