server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
logging:
  level:
    root: INFO
spring:
  application:
    name: checkout-api
  datasource:
    url: ${DB_URL}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
